name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests on pull request
        if: github.event_name == 'pull_request'
        run: pytest -v -m smoke --browser=${{ matrix.browser }} --screenshot=only-on-failure --tracing=retain-on-failure --html=reports/ui-${{ matrix.browser }}-report.html --self-contained-html

      - name: Run regression tests on main
        if: github.event_name == 'push'
        run: pytest -v -m regression --browser=${{ matrix.browser }} --screenshot=only-on-failure --tracing=retain-on-failure --html=reports/ui-${{ matrix.browser }}-report.html --self-contained-html

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/
          retention-days: 7

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest -v -m api        
